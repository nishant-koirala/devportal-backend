spring.application.name=devportal
server.port=${SERVER_PORT:8000}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Frontend Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# MySQL — identity, sessions, tokens, departments, activity, bookmarks, product picks, broadcasts

spring.datasource.app.url=${MYSQL_URL}
spring.datasource.app.username=${MYSQL_USERNAME}
spring.datasource.app.password=${MYSQL_PASSWORD}
spring.datasource.app.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.datasource.app.url}
spring.flyway.user=${spring.datasource.app.username}
spring.flyway.password=${spring.datasource.app.password}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP configuration
app.otp.expiration-minutes=5
app.otp.max-attempts=3

# PRD Section 7 — identity, session, and rate-limit defaults (not hard-coded in services)
app.password.min-length=8
app.verify.token.ttl=24h
app.reset.token.ttl=1h
session.idle.ttl=7d
session.max.ttl=30d
session.internal.idle.ttl=8h
session.internal.max.ttl=24h
login.attempts.limit=10
login.attempts.window=15m
email.request.window=120s
unverified.retention=30d
session.activity-debounce=5m

# Broadcast Webhook configuration
app.broadcast.webhook.enabled=${BROADCAST_WEBHOOK_ENABLED:false}
app.broadcast.webhook.url=${BROADCAST_WEBHOOK_URL:}
app.broadcast.webhook.min-priority=${BROADCAST_WEBHOOK_MIN_PRIORITY:HIGH}

# Bootstrap admin (from .env). Leave blank to skip seeding.
app.seed.admin.email=${ADMIN_EMAIL:subastv.04@gmail.com}
app.seed.admin.password=${ADMIN_PASSWORD:Password@123}
app.seed.admin.full-name=${ADMIN_FULL_NAME:Subas Admin}
