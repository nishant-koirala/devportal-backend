spring.application.name=devportal
server.port=${SERVER_PORT}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP configuration
app.otp.expiration-minutes=5
app.otp.max-attempts=3

# Broadcast Webhook configuration
app.broadcast.webhook.enabled=${BROADCAST_WEBHOOK_ENABLED:false}
app.broadcast.webhook.url=${BROADCAST_WEBHOOK_URL:}
app.broadcast.webhook.min-priority=${BROADCAST_WEBHOOK_MIN_PRIORITY:HIGH}

# Frontend Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
